name: Forward credit candidate validation

on:
  push:
    branches: [codex/forward-total-credit-candidate]

permissions:
  contents: read

concurrency:
  group: forward-credit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Credit, proxy, and legacy policy regressions
        run: go test -race ./internal/meshforward ./internal/meshsshrelay -run '^(TestForwardCredit|TestProxy|TestPacedWriter|TestGrant)' -count=1 -timeout=5m
      - name: Three-node forwarding under the review build
        run: go test -tags arm_forward_review ./internal/server -run '^TestForwardThreeNodesHTTPExactOriginalAndRevocation$' -count=1 -timeout=5m
      - name: Policy, route, and ordinary-build fence regressions
        run: go test ./internal/meshsshrelay ./internal/server ./internal/cli -run '^(TestReviewedPolicyCommitCASAndNoFollow|TestDestinationPolicyRoundTripAndRevocation|TestLegacyUnbudgetedRelayCanBeReviewedButCannotForward|TestForwardRouteBindsServiceAndRefusesSSHClassConfusion|TestForwardSourceTLSKeepsOriginalFailureClassification|TestDisabledForwardAuthorityUnavailable|TestForwardHTTPClientProductionFence)$' -count=1 -timeout=5m
      - name: Vet affected packages and compile public client
        run: |
          go vet ./internal/meshforward ./internal/meshsshrelay ./internal/server ./internal/cli
          go build -o "$RUNNER_TEMP/arm-forward-public" ./cmd/arm
          go build -tags arm_forward_review -o "$RUNNER_TEMP/arm-forward-credit-candidate" ./cmd/arm
      - name: Compiled three-node CLI HTTP and duplex TCP
        run: python3 scripts/test-routed-forward.py --arm "$RUNNER_TEMP/arm-forward-credit-candidate"
