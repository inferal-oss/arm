name: Independent aggregate credit composition validation
on:
  push:
    branches: [codex/forward-total-credit-independent-review]
permissions:
  contents: read
concurrency:
  group: forward-credit-independent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CREDIT_REVIEW_RUNNER: ${{ matrix.os }}
      CREDIT_REVIEW_CONTROL_BASELINE: 3b1351a97af3af753e0f8ba6b4ba51419bc40761
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate exact current composition with original native children
        run: python3 -B scripts/validate-forward-credit-review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: forward-credit-independent-${{ matrix.os }}-${{ github.sha }}
          path: .cache/credit-independent-review/receipts/
          if-no-files-found: error
          retention-days: 7
