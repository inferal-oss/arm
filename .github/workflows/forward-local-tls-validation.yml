name: Forward local TLS candidate validation

on:
  push:
    branches: [codex/forward-local-tls-composed]

permissions:
  contents: read

concurrency:
  group: forward-local-tls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact local TLS source identity and port handoff
        run: go test -race ./internal/cli -run '^TestForwardLocal' -count=1 -timeout=3m
      - name: Plaintext compatibility remains explicit
        run: go test -race ./internal/meshforward -run '^TestCompatibleLocalTLS' -count=1 -timeout=2m
      - name: Existing admission and default fence regressions
        run: go test -race ./internal/cli ./internal/server -run '^(TestForwardSourceAdmissionCancellation|TestForwardSourceAdmissionACKPreservesApplicationBytes|TestForwardHTTPClientProductionFence|TestDisabledForwardAuthorityUnavailable)$' -count=1 -timeout=3m
      - name: Vet affected packages and compile public client
        run: |
          go vet ./internal/mesh ./internal/meshforward ./internal/cli
          go build -o "$RUNNER_TEMP/arm-forward-tls-candidate" ./cmd/arm
