name: Forward relay-loss and Unix prototype candidate

on:
  push:
    branches: [codex/forward-route-loss-acceptance]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      # The unchanged Go prototype tests passed both native jobs at exact
      # source cb6aff2 (run 40451815199); this successor changes only the
      # Python fault controller and its bounded diagnostics.
      - name: Bounded fault diagnostic control
        run: python3 -B scripts/test-routed-forward-loss-bounds.py
      - name: Build exact review executable
        run: go build -tags arm_forward_review -o "$RUNNER_TEMP/arm" ./cmd/arm
      - name: Abrupt relay loss after destination effect
        run: python3 -B scripts/test-routed-forward-loss.py --arm "$RUNNER_TEMP/arm"
