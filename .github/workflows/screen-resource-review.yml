name: Screen original-close retention review

on:
  push:
    branches: [codex/vnc-resource-hold-fixed-ci]

permissions:
  contents: read

concurrency:
  group: screen-resource-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate exact composed screen holds without CPU admission override
        run: python3 -B scripts/validate-screen-resource-review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screen-resource-${{ matrix.os }}
          path: |
            .cache/screen-resource-ci/*.json
            .cache/screen-resource-ci/*.log
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
