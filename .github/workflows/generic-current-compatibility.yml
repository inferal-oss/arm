name: Generic current compatibility
on:
  push:
    branches: [codex/generic-current-compatibility-ci]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch declared public dependencies
        run: go mod download
      - name: Run source-bound native gates
        run: python3 scripts/test-generic-current-ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generic-current-${{ matrix.os }}-${{ github.sha }}
          path: .ci-evidence/generic-current
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
