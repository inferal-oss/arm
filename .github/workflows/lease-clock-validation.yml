name: Lease clock validation
on:
  push:
    branches: [codex/lease-clock-root-validation]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch declared public dependencies
        run: go mod download
      - name: Run source-bound native gates
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            validation_uid="$(id -u)"
            validation_gid="$(id -g)"
            validation_parent_pidns="$(stat -Lc %i /proc/self/ns/pid)"
            validation_parent_mountns="$(stat -Lc %i /proc/self/ns/mnt)"
            sudo -n --preserve-env=PATH,HOME,GITHUB_SHA,GITHUB_WORKSPACE,RUNNER_OS,RUNNER_ARCH,ImageOS,ImageVersion unshare --mount --propagation private --pid --fork --kill-child=SIGKILL --mount-proc setpriv --reuid="$validation_uid" --regid="$validation_gid" --init-groups --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs --pdeathsig=keep env ARM_CI_EXPECT_UID="$validation_uid" ARM_CI_EXPECT_GID="$validation_gid" ARM_CI_PARENT_PIDNS="$validation_parent_pidns" ARM_CI_PARENT_MOUNTNS="$validation_parent_mountns" /bin/bash scripts/ci-pidns-entry.sh python3 scripts/test-lease-clock-ci.py
          else
            python3 scripts/test-lease-clock-ci.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lease-clock-${{ matrix.os }}-${{ github.sha }}
          path: .tla/clock-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  formal:
    needs: native
    if: always()
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Require actual Darwin ARM64
        run: python3 -c "import platform; print(platform.uname()); assert platform.system() == 'Darwin' and platform.machine() == 'arm64'"
      - name: Materialize declared public dependencies
        run: go mod download
      - name: Materialize exact locked public TLC input
        run: |
          umask 077
          mkdir -p .tla/downloads
          curl --fail --location --max-time 60 --retry 2 --output .tla/downloads/tla2tools.jar https://raw.githubusercontent.com/inferal-oss/arm/dd2423e012973c117fbe128e8dbd3b8e693a0540/ci/formal-pins/tla2tools.jar
      - name: Provision checksum-locked TLC
        run: python3 scripts/provision-tla.py --component tlc
      - name: Run TLC safety and Go trace components (strict proof pending)
        run: python3 scripts/test-lease-clock-formal-ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lease-clock-formal-macos-15-${{ github.sha }}
          path: |
            .tla/lease-clock
            .tla/clock-formal-wrapper
            .tla/tools/tlc/.arm-tool.json
            .tla/tools/tlapm/.arm-tool.json
            formal/tools.lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
