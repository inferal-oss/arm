name: Reviewed composed local forward TLS validation

on:
  push:
    branches: [codex/forward-tls-independent-review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-tls-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'inferal-oss/arm' && github.ref == 'refs/heads/codex/forward-tls-independent-review'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      FORWARD_TLS_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact native source and composed TLS plus three-node public CLI
        run: python3 -B scripts/validate-forward-tls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: forward-tls-native-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: .cache/forward-tls-ci/receipts/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
