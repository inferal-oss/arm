<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="title description"><title id="title">ARM identity exploration — Carve</title><desc id="description">A proposed direction for review; not installed branding.</desc><rect x="0" y="0" width="720" height="392" rx="0" fill="#10181d"/><g transform="translate(40 44) scale(1.625)"><path fill="#83dfc8" d="M28 16H46V50H80V68Q80 80 68 80H28Q16 80 16 68V28Q16 16 28 16Z"/><rect x="58" y="16" width="22" height="22" rx="5" fill="#eaf4ef"/></g><g transform="translate(258 58) scale(2.4)"><g fill="none" stroke="#eaf4ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M28 21V46M28 33A13 13 0 1 0 2 33A13 13 0 1 0 28 33"/><path d="M45 46V21M45 31Q48 20 60 23"/><path d="M75 46V23M75 31C75 18 92 18 92 31V46M92 31C92 18 109 18 109 31V46"/></g></g><text x="40" y="250" fill="#eaf4ef" font-family="Inter,Helvetica,Arial,sans-serif" font-size="28" font-weight="650">Carve</text><text x="40" y="285" fill="#b6c9ca" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="400">Finite capacity. A deliberate allocation.</text><text x="40" y="327" fill="#b6c9ca" font-family="Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400">One continuous pool; one separated slice.</text><text x="40" y="354" fill="#8da5a9" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400">Strongest small-size silhouette; less literal about time.</text></svg>
