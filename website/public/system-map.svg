<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="system-title system-desc">
<title id="system-title">ARM operational system map</title>
<desc id="system-desc">Agents running builds, tests and analysis use the CLI or local API. Operators use web and terminal dashboards. Both connect to the same per-host ARM backend. It coordinates CPU and memory budgets, custom pools, managed storage, held TCP and UDP ports, supervised commands, and a SQLite ownership and event ledger. Explicit grants authorize scoped remote leases, execution and messages with an optional peer host.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
